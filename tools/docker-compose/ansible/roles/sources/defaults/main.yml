---
compose_name: 'docker-compose.yml'
ascender_image: 'ghcr.io/ctrliq/ascender_devel'
pg_port: 5432
pg_username: 'awx'
pg_database: 'awx'
control_plane_node_count: 1
minikube_container_group: false
receptor_socket_file: /var/run/ascender-receptor/receptor.sock
# receptor_image: quay.io/ansible/receptor:v1.5.7
receptor_image: quay.io/ansible/receptor:devel
ingress_path: /

# Keys for signing work
receptor_rsa_bits: 4096
receptor_work_sign_reconfigure: false
sign_work: no  # currently defaults to no because openssl version mismatch causes "unknown block type PRIVATE KEY"
work_sign_key_dir: '../_sources/receptor'
work_sign_private_keyfile: "{{ work_sign_key_dir }}/work_private_key.pem"
work_sign_public_keyfile: "{{ work_sign_key_dir }}/work_public_key.pem"

# Metrics
scrape_interval: '5s'

# editable_dependencies
install_editable_dependencies: false
editable_dependencies: []

# NetBox, for developing against the netbox inventory source. Off unless
# `make docker-compose NETBOX=true`. Every value here is a development
# default and none of it is a secret.
netbox: false
netbox_image: docker.io/netboxcommunity/netbox
netbox_image_tag: v4.7-5.1.2
netbox_superuser: admin
netbox_superuser_password: admin
netbox_secret_key: 'dev-only-netbox-secret-key-not-for-any-real-deployment'
netbox_token_pepper: 'dev-only-netbox-token-pepper-not-for-any-real-deploy'
netbox_api_key: 'abcdefghijkl'
netbox_api_token: '0123456789abcdef0123456789abcdef01234567'
